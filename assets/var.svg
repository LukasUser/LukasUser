<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="VaR backtesting engine: 5 models judged over 2,699 trading days">
  <title>VaR backtesting engine</title>
  <defs>
    <linearGradient id="bg-var" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a2f"/>
    </linearGradient>
    <radialGradient id="glow-var" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg-var)"/>
  <rect width="600" height="260" rx="16" fill="url(#glow-var)"/>
  <rect x="0.5" y="0.5" width="599" height="259" rx="16" fill="none" stroke="#2a3550"/>
  <rect x="0" y="28" width="5" height="44" rx="2.5" fill="#a78bfa"/>
  <text x="32" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">VaR backtesting engine</text>
  <text x="32" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#a78bfa">5 models</text>
  <text x="32" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">judged over 2,699 trading days</text>
  <text x="32" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Kupiec and Christoffersen tests, EVT, GARCH</text>
  <rect x="32" y="214" width="78" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/><text x="44" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a78bfa">Python</text><rect x="120" y="214" width="69" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/><text x="132" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a78bfa">SciPy</text><rect x="199" y="214" width="105" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/><text x="211" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a78bfa">Streamlit</text>
  
</svg>
