<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Australian Open 2024 Monte Carlo: 100,000 simulated tournaments">
  <title>Australian Open 2024 Monte Carlo</title>
  <defs>
    <linearGradient id="bg-ao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a2f"/>
    </linearGradient>
    <radialGradient id="glow-ao" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg-ao)"/>
  <rect width="600" height="260" rx="16" fill="url(#glow-ao)"/>
  <rect x="0.5" y="0.5" width="599" height="259" rx="16" fill="none" stroke="#2a3550"/>
  <rect x="0" y="28" width="5" height="44" rx="2.5" fill="#4ade80"/>
  <text x="32" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Australian Open 2024 Monte Carlo</text>
  <text x="32" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#4ade80">100,000</text>
  <text x="32" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">simulated tournaments</text>
  <text x="32" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Champion Sinner was the model's #2 pick</text>
