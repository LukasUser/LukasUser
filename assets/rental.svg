<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="Wilmington rental pipeline: 50/day live listings scored by Claude">
  <title>Wilmington rental pipeline</title>
  <defs>
    <linearGradient id="bg-rental" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a2f"/>
    </linearGradient>
    <radialGradient id="glow-rental" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="260" rx="16" fill="url(#bg-rental)"/>
  <rect width="600" height="260" rx="16" fill="url(#glow-rental)"/>
  <rect x="0.5" y="0.5" width="599" height="259" rx="16" fill="none" stroke="#2a3550"/>
  <rect x="0" y="28" width="5" height="44" rx="2.5" fill="#fb923c"/>
  <text x="32" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Wilmington rental pipeline</text>
  <text x="32" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#fb923c">50/day</text>
  <text x="32" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">live listings scored by Claude</text>
  <text x="32" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Bronze → Silver → Gold, alerts for every 9/10</text>
  <rect x="32" y="214" width="114" height="30" rx="15" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.45"/><text x="44" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#fb923c">Databricks</text><rect x="156" y="214" width="87" height="30" rx="15" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.45"/><text x="168" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#fb923c">PySpark</text><rect x="253" y="214" width="114" height="30" rx="15" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.45"/><text x="265" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#fb923c">Claude API</text>
  
